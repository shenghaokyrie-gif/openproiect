# 我的 DHALSIM 场景模板
# 基于 anytown 示例改写，字段名对照过 dhalsim/parser/config_parser.py 与 physical_process.py
# 用法：sudo dhalsim 我的场景模板.yaml
# 注意：plcs / attacks 用 !include 拆文件（依赖 pyyaml-include），这里为了单文件可读性写内联

# ---------- 必填 ----------
inp_file: my_network.inp
output_path: output/my_run
iterations: 2880                 # 迭代号 = hydraulic timestep，不是秒

# ---------- 仿真内核 ----------
# 二选一：epynet（示例全用它，支持泵速） / wntr（EPA 官方绑定，但缺泵速）
simulator: epynet
demand: pdd                      # 透传给 WNTR 的 demand model：pdd / dd

# ---------- 网络拓扑 ----------
# simple  = 所有 PLC+SCADA 同局域网，共用一个 router
# complex = 每台各有独立 switch+router，走公网 IP（做 MITM 更真实）
network_topology_type: complex

log_level: info

# ---------- 数据文件（可选） ----------
# demand_patterns: demands_anytown_small.csv
# initial_tank_data: initial_tank.csv

# ---------- PLC 与测点绑定 ----------
# 铁律：这里的名字必须真实存在于 .inp 里，写错不报错，只是 SCADA 里少一列
plcs:
  - name: PLC1
    actuators:                   # 只能填 valve / pump 的名字
      - P78
      - P79
  - name: PLC2
    sensors:                     # 只能填 tank名 / junction名 / 阀名F / 泵名F
      - T41
  - name: PLC3
    sensors:
      - T42

# ---------- 噪声 ----------
# 加在 PLC 上报值上的高斯噪声尺度，默认 0（干净数据）
# 想做真实一点的实验就开，wadi 示例用的是 0.25
noise_scale: 0.25

